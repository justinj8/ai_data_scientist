# One command: docker compose up --build   → open http://127.0.0.1:8000
services:
  app:
    build: .
    init: true                   # a real PID 1 that reaps orphaned processes (e.g. killed kernel leftovers)
    ports:
      - "127.0.0.1:8000:8000"   # ChatGPT sign-in redirects to http://127.0.0.1:8000/auth/callback
    env_file:
      - path: .env
        required: false
    volumes:
      - adsci-data:/app/data     # encrypted credentials and session files
    mem_limit: 6g                # a runaway analysis gets its kernel killed and restarted, not the host
    depends_on:
      postgres:
        condition: service_healthy

  # Demo database seeded with the same sample data. From the app, connect with
  # host "postgres", port 5432, database "retail", user "analyst", password "analyst" (read-only).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: adsci
      POSTGRES_PASSWORD: adsci
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./sample_data/out:/seed:ro
      - ./sample_data/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adsci -d retail"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  adsci-data:
