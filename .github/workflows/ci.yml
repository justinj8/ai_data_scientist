name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --project backend --frozen
      - name: Generate sample data
        run: uv run --project backend python sample_data/generate.py
      - name: Start demo Postgres
        run: docker compose up -d --wait postgres
      - name: Lint
        run: uv run --project backend ruff check backend
      - name: Test
        env:
          ADSCI_TEST_PG_URL: postgresql+psycopg://analyst:analyst@127.0.0.1:5433/retail
        run: cd backend && uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-data-scientist .
